<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MarkBeen5 Admin</title><link rel="stylesheet" href="style.css"><style>.wrap{max-width:900px;margin:auto;padding:25px}.box{background:#0d1219;border:1px solid #1b3854;border-radius:12px;padding:22px;margin:15px 0}.box input,.box textarea,.box select{width:100%;background:#050608;color:white;border:1px solid #1b3854;border-radius:7px;padding:11px;margin:6px 0 12px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}.hidden{display:none}.item{padding:12px 0;border-bottom:1px solid #182a3c;display:flex;justify-content:space-between;gap:10px}.danger{background:#321116;color:#ff8b95;border:1px solid #6c1c29;padding:8px;border-radius:6px}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script></head><body><div class="wrap"><a href="index.html">← VIEW SITE</a><div id="login" class="box"><h1>MARKBEEN5 ADMIN</h1><input id="email" type="email" placeholder="Email"><input id="pass" type="password" placeholder="Password"><button class="btn" onclick="login()">SIGN IN</button><p id="msg"></p></div><div id="dash" class="hidden"><div class="box"><h1>Control Center</h1><button class="btn" onclick="logout()">LOG OUT</button></div><div class="box"><h2>Site</h2><input id="tag" placeholder="Tagline"><button class="btn" onclick="saveSite()">SAVE</button></div><div class="box"><h2>Live</h2><label><input id="enabled" type="checkbox"> LIVE</label><input id="ltitle" placeholder="Live title"><textarea id="ldesc" placeholder="Description"></textarea><input id="lurl" placeholder="Stream URL"><button class="btn" onclick="saveLive()">SAVE</button></div><div class="box"><h2>Stats</h2><div class="row"><input id="wins" placeholder="Wins"><input id="losses" placeholder="Losses"><input id="streak" placeholder="Streak"></div><button class="btn" onclick="saveStats()">SAVE</button></div><div class="box"><h2>Add Clip</h2><input id="ct" placeholder="Title"><input id="cu" placeholder="Clip URL"><input id="cd" placeholder="Description"><button class="btn" onclick="add('clips',{title:v('ct'),url:v('cu'),description:v('cd')})">ADD</button><div id="clips"></div></div><div class="box"><h2>Add Madden Play</h2><input id="pn" placeholder="Play name"><div class="row"><select id="pt"><option>Offense</option><option>Defense</option></select><select id="pc"><option>Man</option><option>Zone</option></select></div><input id="pd" placeholder="Coaching tip"><button class="btn" onclick="add('plays',{name:v('pn'),type:v('pt'),coverage:v('pc'),detail:v('pd')})">ADD</button><div id="plays"></div></div><div class="box"><h2>Add Schedule</h2><div class="row"><input id="sd" placeholder="Monday"><input id="st" placeholder="6 PM – 12 AM EST"></div><button class="btn" onclick="add('schedule',{day:v('sd'),time:v('st')})">ADD</button><div id="schedule"></div></div><div class="box"><h2>Add Social</h2><div class="row"><input id="sp" placeholder="Platform"><input id="sh" placeholder="@handle"><input id="su" placeholder="URL"></div><button class="btn" onclick="add('social_links',{platform:v('sp'),handle:v('sh'),url:v('su')})">ADD</button><div id="social"></div></div></div></div><script>const c=window.MARKBEEN5_CONFIG;const s=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_PUBLISHABLE_KEY);const v=id=>document.getElementById(id).value;async function login(){let r=await s.auth.signInWithPassword({email:v('email'),password:v('pass')});if(r.error)document.getElementById('msg').textContent=r.error.message;else init()}async function init(){let u=(await s.auth.getUser()).data.user;if(!u){return}let a=await s.rpc('is_admin');if(!a.data){alert('This account is not an admin.');await logout();return}document.getElementById('login').classList.add('hidden');document.getElementById('dash').classList.remove('hidden');await load()}async function logout(){await s.auth.signOut();location.reload()}async function rows(t){let r=await s.from(t).select('*').order('created_at',{ascending:true});return r.data||[]}async function load(){let site=await rows('site_settings'),live=await rows('live_status'),stats=await rows('stats');let x=site[0]||{};document.getElementById('tag').value=x.tagline||'';x=live[0]||{};enabled.checked=!!x.enabled;ltitle.value=x.title||'';ldesc.value=x.description||'';lurl.value=x.url||'';x=stats[0]||{};wins.value=x.wins||0;losses.value=x.losses||0;streak.value=x.streak||'';for(let t of ['clips','plays','schedule','social_links'])render(t)}async function up(t,o){let r=await s.from(t).insert(o);if(r.error)alert(r.error.message);await load()}async function add(t,o){await up(t,o)}async function saveSite(){let r=await s.from('site_settings').select('id').limit(1);await s.from('site_settings').update({tagline:v('tag')}).eq('id',r.data[0].id);await load()}async function saveLive(){let r=await s.from('live_status').select('id').limit(1);await s.from('live_status').update({enabled:enabled.checked,title:v('ltitle'),description:v('ldesc'),url:v('lurl')}).eq('id',r.data[0].id);await load()}async function saveStats(){let r=await s.from('stats').select('id').limit(1);await s.from('stats').update({wins:+v('wins'),losses:+v('losses'),streak:v('streak')}).eq('id',r.data[0].id);await load()}async function render(t){let a=await rows(t);let id=t==='social_links'?'social':t;document.getElementById(id).innerHTML=a.map(x=>`<div class="item"><span>${x.title||x.name||x.day||x.platform} — ${x.url||x.time||x.handle||''}</span><button class="danger" onclick="del('${t}','${x.id}')">DELETE</button></div>`).join('')}async function del(t,id){if(confirm('Delete?')){await s.from(t).delete().eq('id',id);await load()}}init();</script></body></html>
