name: Sync Twitch Live Status

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/twitch-live-sync.yml'
      - 'scripts/twitch-live-sync.mjs'

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Supabase client
        run: npm install --no-save @supabase/supabase-js@2

      - name: Sync Twitch live status
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          SUPABASE_URL: https://wifkhdvmuiioisetzqfr.supabase.co
          TWITCH_LOGIN: markbeen5
        run: node scripts/twitch-live-sync.mjs
